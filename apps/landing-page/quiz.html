<meta charset="utf-8">

<title>Your phone vs. God | FaithLock</title>
<meta name="description" content="Four taps. See how your week really splits between your phone and God.">
<!--
  The page behind the TikTok bio link: four taps, then the visitor's week told in a few animated
  screens, then the App Store. An install button stays at the bottom from the first question on.
  One self-contained file, no dependency: it must load at once in TikTok's built-in browser.

  Opened in a real browser from a bio link (TikTok's « Open in browser »), the page skips the quiz
  and sends the visitor to the App Store. TikTok usually reopens the link as it was first tapped,
  without the flags this page adds to the address, so the bio path itself marks the escape.

  Host it on the exact host of the bio link (https://www.getfaithlock.com/quiz.html, with
  utm_source=tiktok): TikTok blocks a link that redirects to another host.

  Every number shown comes from the visitor's own answers. Verses are from the Berean Standard Bible.
-->
<style>
  :root {
    --cream: #FBF3E2; --surface: #FFFDF8; --muted: #F3E7CE; --ink: #3D2B1F; --ink-soft: #9C8773;
    --primary: #D68A4E; --primary-dark: #C0763C; --primary-light: #E8B488; --gold: #C9A962;
    --peach: #F3D9BE; --sage: #CFDDC3; --line: #EAD9BC;
    --hard: 3px 5px 0 0 var(--ink); --hard-sm: 2px 3px 0 0 var(--ink);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--cream); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased; line-height: 1.5;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  [hidden] { display: none !important; }

  .page { max-width: 460px; min-height: 100vh; min-height: 100dvh; margin: 0 auto; padding: 20px 20px 0; display: flex; flex-direction: column; }

  /* Questions: where you are, without words */
  .progress { display: flex; gap: 6px; }
  .progress span { flex: 1; height: 8px; border-radius: 99px; border: 2px solid var(--ink); background: var(--surface); transition: background .3s; }
  .progress span.now { background: var(--primary-light); }
  .progress span.done { background: var(--primary); }

  /* Result screens: story bars that fill while a screen holds */
  .stories { display: flex; gap: 6px; padding-top: 2px; }
  .stories span { flex: 1; height: 6px; border-radius: 99px; background: rgba(61, 43, 31, .15); overflow: hidden; }
  .stories i { display: block; width: 0; height: 100%; border-radius: 99px; background: var(--ink); }
  .stories .done i { width: 100%; }
  .stories .now i { animation: fill 4s linear forwards; }
  .stories.paused .now i { animation-play-state: paused; }
  @keyframes fill { from { width: 0; } to { width: 100%; } }

  main { flex: 1; display: flex; flex-direction: column; padding: 32px 0 40px; }
  .enter { animation: enter .25s cubic-bezier(.16, 1, .3, 1) both; }
  @keyframes enter { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  h1 { margin: 0; font-size: 28px; line-height: 1.15; font-weight: 800; letter-spacing: -.02em; }
  .hint { margin: 10px 0 0; font-size: 15px; line-height: 1.4; color: var(--ink-soft); }

  .options { margin-top: 28px; display: flex; flex-direction: column; gap: 12px; }
  .option {
    min-height: 60px; width: 100%; padding: 0 20px; display: flex; align-items: center; justify-content: space-between;
    text-align: left; font-size: 17px; font-weight: 700; background: var(--surface); border: 2.5px solid var(--ink);
    border-radius: 22px; box-shadow: var(--hard-sm); transition: transform .1s, box-shadow .1s, background .1s;
  }
  .option:active, .option.chosen { transform: translate(2px, 3px); box-shadow: none; }
  .option.chosen { background: var(--primary); color: #fff; }
  .option .tick { width: 24px; height: 24px; flex: none; border-radius: 50%; border: 2px solid rgba(61, 43, 31, .3); display: flex; align-items: center; justify-content: center; color: transparent; }
  .option.chosen .tick { border-color: #fff; background: #fff; color: var(--primary); }
  .option:focus-visible, .btn:focus-visible, .link:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
  .link { align-self: flex-start; margin-top: 24px; padding: 8px 4px; background: none; border: 0; font-size: 14px; font-weight: 700; color: var(--ink-soft); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 4px; }

  .adding { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-bottom: 96px; text-align: center; }
  .bars { display: flex; align-items: flex-end; gap: 8px; }
  .bars i { width: 16px; border: 2px solid var(--ink); border-radius: 6px 6px 0 0; background: var(--primary); transform-origin: bottom; animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: .35; transform: scaleY(.7); } 50% { opacity: 1; transform: scaleY(1); } }
  .adding p { margin: 24px 0 0; font-size: 20px; font-weight: 800; }

  /* One idea per screen, one screen at a time */
  .slides { flex: 1; justify-content: center; align-items: center; text-align: center; padding: 24px 0 140px; cursor: pointer; user-select: none; -webkit-user-select: none; animation: in-next .25s cubic-bezier(.16, 1, .3, 1) both; }
  .slides.back { animation-name: in-prev; }
  .slides.last { cursor: default; }
  @keyframes in-next { from { opacity: 0; transform: translateX(36px); } to { opacity: 1; transform: none; } }
  @keyframes in-prev { from { opacity: 0; transform: translateX(-36px); } to { opacity: 1; transform: none; } }

  .slides .st:nth-child(2) { animation-delay: .06s; }
  .slides .st:nth-child(3) { animation-delay: .12s; }
  .slides .st:nth-child(4) { animation-delay: .18s; }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

  .meter { margin-top: 28px; width: 100%; text-align: left; }
  .meter .row { display: flex; align-items: baseline; justify-content: space-between; }
  .meter .name { font-size: 16px; font-weight: 700; }
  .meter .value { font-size: 40px; line-height: 1; font-weight: 800; font-variant-numeric: tabular-nums; }
  .meter .value small { margin-left: 4px; font-size: 20px; }
  .track { margin-top: 10px; height: 30px; border-radius: 99px; border: 2.5px solid var(--ink); background: var(--surface); overflow: hidden; }
  .track b { display: block; height: 100%; width: 0; border-radius: 99px; background: var(--primary); transition: width .5s ease-out; }
  .track b.god { background: var(--gold); transition-delay: .15s; }

  .huge { margin: 0; font-size: 120px; line-height: .9; font-weight: 900; letter-spacing: -.05em; color: var(--primary-dark); font-variant-numeric: tabular-nums; }
  .huge-label { margin: 12px 0 0; font-size: 28px; line-height: 1.15; font-weight: 800; letter-spacing: -.02em; }
  .sub { margin: 18px 0 0; font-size: 18px; line-height: 1.45; color: rgba(61, 43, 31, .85); }

  .verse-slide { margin: 0; }
  .verse-slide blockquote { margin: 0; font-family: Georgia, Cambria, serif; font-style: italic; font-size: 30px; line-height: 1.25; }
  .verse-slide blockquote::before { content: "“"; display: block; height: 40px; font-size: 80px; line-height: 1; color: var(--primary); }
  .verse-slide figcaption { margin-top: 16px; font-size: 14px; font-weight: 800; color: var(--ink-soft); }

  /* The lock, shown rather than told */
  .phone { position: relative; width: 172px; height: 300px; margin: 28px auto 0; padding: 10px; border: 3px solid var(--ink); border-radius: 30px; background: var(--surface); box-shadow: var(--hard); }
  .phone::before { content: ""; position: absolute; top: 8px; left: 50%; width: 48px; height: 6px; margin-left: -24px; border-radius: 99px; background: rgba(61, 43, 31, .8); }
  .screen { height: 100%; padding: 0 12px; border-radius: 20px; background: var(--cream); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; }
  .tile { width: 56px; height: 56px; border-radius: 16px; border: 2.5px solid var(--ink); background: var(--muted); display: flex; align-items: center; justify-content: center; }
  .tile.open { background: var(--sage); }
  .app { font-size: 13px; font-weight: 800; line-height: 1.2; }
  .pill { padding: 2px 10px; border-radius: 99px; border: 2px solid var(--ink); font-size: 10px; font-weight: 800; }
  .pill.locked { background: var(--ink); color: var(--cream); }
  .pill.unlocked { background: var(--sage); }
  .tiny { font-size: 10px; font-weight: 800; color: var(--ink-soft); }
  .tiny.caps { text-transform: uppercase; letter-spacing: .06em; }
  .screen .scripture { margin: 0; font-family: Georgia, Cambria, serif; font-style: italic; font-size: 13px; line-height: 1.35; }
  .art { display: block; width: 100%; max-width: 230px; height: auto; margin: 0 auto 18px; overflow: visible; }
  /* Back in a real browser after leaving TikTok: the install button alone, at the top */
  .store-only { text-align: center; padding-top: 8px; }
  .store-only .btn { margin-top: 22px; }
  .store-only .sub { margin-top: 10px; }
  /* The questions keep their last option clear of the install bar */
  body.has-cta main { padding-bottom: 128px; }
  @media (max-height: 700px) {
    .phone { width: 148px; height: 250px; margin-top: 20px; }
    .huge { font-size: 96px; }
    .verse-slide blockquote { font-size: 26px; }
  }

  /* The bottom action, always within reach of the thumb */
  .cta { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; padding: 14px 20px; padding-bottom: max(14px, env(safe-area-inset-bottom)); border-top: 2.5px solid var(--ink); background: var(--cream); }
  .cta .inner { max-width: 420px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .btn { width: 100%; height: 56px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 99px; border: 2.5px solid var(--ink); box-shadow: var(--hard); background: var(--primary); color: #fff; font-size: 17px; font-weight: 800; text-decoration: none; transition: transform .1s, box-shadow .1s; }

  .btn.cream { background: var(--surface); color: var(--ink); }
  .btn.small { height: 48px; font-size: 15px; }

  .sheet { width: 100%; max-width: 420px; margin: 0 auto; padding: 20px; border-radius: 22px; border: 2.5px solid var(--ink); background: var(--surface); box-shadow: var(--hard); }
  .sheet h3 { margin: 0; font-size: 20px; line-height: 1.2; font-weight: 800; }
  .sheet ol { list-style: none; margin: 16px 0 0; padding: 0; display: flex; flex-direction: column; gap: 12px; font-size: 16px; font-weight: 500; line-height: 1.35; }
  .sheet li { display: flex; align-items: flex-start; gap: 12px; }
  .sheet li i { width: 28px; height: 28px; flex: none; border-radius: 50%; border: 2.5px solid var(--ink); background: var(--peach); display: flex; align-items: center; justify-content: center; font-style: normal; font-size: 14px; font-weight: 800; }
  .sheet li b { font-weight: 800; }
  .sheet .actions { margin-top: 20px; display: flex; gap: 12px; }

  @media (prefers-reduced-motion: reduce) {
    .enter, .bars i, .pointer svg, .slides, .slides .st, .btn.go { animation: none !important; }
    .track b, .option, .btn { transition: none !important; }
  }
</style>

  var INK = '#3D2B1F';
  function art(inner) {
    return '<svg class="art" viewBox="0 0 220 150" fill="none" stroke="' + INK + '" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + inner + '</svg>';
  }
  function shadowed(shape, fill) { // the same shape twice: the ink shadow, then the filled one
    return shape.replace('/>', ' fill="' + INK + '" transform="translate(3 5)"/>') + shape.replace('/>', ' fill="' + fill + '"/>');
  }
  var ARTS = {
    phone: art(
      shadowed('<rect x="78" y="10" width="64" height="122" rx="13"/>', '#FFFDF8') +
      '<rect x="86" y="24" width="48" height="90" rx="5" fill="#F3D9BE"/><path d="M101 17h18"/>' +
      '<circle cx="110" cy="69" r="21" fill="#FFFDF8"/><path d="M110 56v13l9 6"/>' +
      shadowed('<circle cx="46" cy="42" r="15"/>', '#E8B488') + '<path d="M40 42h12M46 36v12" stroke-width="2.5"/>' +
      shadowed('<rect x="160" y="78" width="34" height="34" rx="9"/>', '#CFDDC3') + '<path d="M171 89l14 6-14 6z" fill="' + INK + '"/>'),
    god: art(
      shadowed('<path d="M110 40 C 92 30, 62 30, 40 38 V 118 C 62 110, 92 110, 110 120 Z"/>', '#FFFDF8') +
      shadowed('<path d="M110 40 C 128 30, 158 30, 180 38 V 118 C 158 110, 128 110, 110 120 Z"/>', '#FFFDF8') +
      '<path d="M110 40v80"/><path d="M58 60h36M58 74h36M58 88h28M126 60h36M126 74h36M126 88h28" stroke-width="2.5"/>' +
      '<path d="M110 8v16M96 14l6 10M124 14l-6 10" stroke="#C9A962" stroke-width="4"/>'),
    apps: art(
      shadowed('<rect x="22" y="48" width="52" height="52" rx="14"/>', '#3D2B1F') + '<path d="M44 64v24a6 6 0 1 1-6-6M44 64c2 5 6 8 11 8" stroke="#FFFDF8"/>' +
      shadowed('<rect x="84" y="36" width="52" height="52" rx="14"/>', '#E8B488') + '<rect x="96" y="48" width="28" height="28" rx="8" fill="#FFFDF8"/><circle cx="110" cy="62" r="7" fill="#E8B488"/>' +
      shadowed('<rect x="146" y="48" width="52" height="52" rx="14"/>', '#D68A4E') + '<path d="M165 64l16 10-16 10z" fill="#FFFDF8"/>' +
      '<path d="M60 124c30 10 70 10 100 0" stroke="#C9A962" stroke-width="3.5"/>'),
    when: art(
      shadowed('<circle cx="70" cy="74" r="30"/>', '#E8B488') +
      '<path d="M70 26v10M70 112v10M22 74h10M108 74h10M36 40l7 7M97 101l7 7M36 108l7-7M97 47l7-7" stroke-width="3.5"/>' +
      shadowed('<path d="M170 44 a 32 32 0 1 0 22 54 a 26 26 0 1 1 -22 -54 Z"/>', '#FFFDF8') +
      '<path d="M150 40l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#C9A962" stroke-width="2"/>')
  };

  // ─── State ───────────────────────────────────────────────────
  var $ = function (id) { return document.getElementById(id); };
  var answers = {};
  var step = 0;
  var screen = $('screen'), progress = $('progress'), stories = $('stories');
  var cta = $('cta'), ctaInner = $('ctaInner'), coach = $('coach');
  var demoTimer = 0;

  function encode() { return QUESTIONS.map(function (q) { return answers[q.id]; }).join('.'); }
  function decode(raw) {
    if (!raw) return null;
    var parts = raw.split('.'), out = {};
    if (parts.length !== QUESTIONS.length) return null;
    for (var i = 0; i < QUESTIONS.length; i++) {
      var known = QUESTIONS[i].options.some(function (o) { return o[0] === parts[i]; });
      if (!known) return null;
      out[QUESTIONS[i].id] = parts[i];
    }
    return out;
  }
  function setQuery(change) {
    try {
      var url = new URL(location.href);
      change(url.searchParams);
      history.replaceState(null, '', url);
    } catch (e) { /* a local file: the address stays as it is */ }
  }

  function formatMinutes(total) {
    if (total < 60) return total + ' min';
    var h = Math.floor(total / 60), m = total % 60;
    return m ? h + ' h ' + (m < 10 ? '0' + m : m) : h + ' h';
  }
  function compute() {
    var hours = PHONE_HOURS[answers.phone], minutes = GOD_MINUTES[answers.god];
    var phoneMin = hours * 7 * 60, godMin = minutes * 7;
    return {
      phoneHoursWeek: Math.round(hours * 7),
      godMinutesWeek: godMin,
      phoneDaysYear: Math.round(hours * 365 / 24),
      ratio: godMin > 0 ? Math.round(phoneMin / godMin) : null,
      godShare: Math.min(1, godMin / phoneMin),
      appName: APP_NAMES[answers.app],
      when: answers.when
    };
  }

  /** Replays an element's entrance. */
  function restart(el) { el.style.animation = 'none'; void el.offsetWidth; el.style.animation = ''; }

  // ─── Questions ───────────────────────────────────────────────
  function renderProgress() {
    progress.hidden = false;
    stories.hidden = true;
    progress.setAttribute('aria-valuenow', String(Math.min(step, 4)));
    progress.innerHTML = QUESTIONS.map(function (q, i) {
      return '<span class="' + (i < step ? 'done' : i === step ? 'now' : '') + '"></span>';
    }).join('');
  }

  function renderQuestion() {
    var q = QUESTIONS[step];
    // The way to the App Store is there from the first question: nobody has to finish the quiz.
    if (android) hideCta(); else renderCta(true, 'Get FaithLock on the App Store', 'quiz_question');
    renderProgress();
    screen.className = 'enter';
    screen.innerHTML =
      ARTS[q.id] +
      '<h1>' + q.title + '</h1>' +
      (q.hint ? '<p class="hint">' + q.hint + '</p>' : '') +
      '<div class="options">' + q.options.map(function (o) {
        return '<button type="button" class="option' + (answers[q.id] === o[0] ? ' chosen' : '') + '" data-id="' + o[0] + '">' + o[1] +
          '<span class="tick" aria-hidden="true"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 12 10 17 19 7"/></svg></span></button>';
      }).join('') + '</div>' +
      (step > 0 ? '<button type="button" class="link" id="back">Back</button>' : '');
    restart(screen);

    Array.prototype.forEach.call(screen.querySelectorAll('.option'), function (button) {
      button.addEventListener('click', function () {
        if (screen.dataset.locked) return;
        screen.dataset.locked = '1';
        Array.prototype.forEach.call(screen.querySelectorAll('.option'), function (b) { b.classList.remove('chosen'); });
        button.classList.add('chosen');
        answers[q.id] = button.dataset.id;
        track('diagnostic_answer', { question: q.id, value: button.dataset.id, step: step + 1 });
        // A beat on the chosen answer, then the next question (or the sum).
        setTimeout(function () {
          delete screen.dataset.locked;
          step += 1;
          if (step < QUESTIONS.length) renderQuestion(); else renderAdding();
        }, 120);
      });
    });
    var back = $('back');
    if (back) back.addEventListener('click', function () { step -= 1; renderQuestion(); });
  }

  function renderAdding() {
    if (reducedMotion) return renderResult(false, false);
    renderProgress();
    screen.className = 'adding enter';
    screen.innerHTML = '<div class="bars" aria-hidden="true">' + [36, 60, 44, 72].map(function (h, i) {
      return '<i style="height:' + h + 'px;animation-delay:' + (i * 140) + 'ms"></i>';
    }).join('') + '</div><p role="status">Adding up your week…</p>';
    restart(screen);
    setTimeout(function () { renderResult(false, false); }, 600);
  }

  // ─── Result: a few animated screens, one idea each ───────────
  /** How long each screen holds before the next one; the last one stays. */
  var SLIDE_MS = [3000, 3000, 3500];
  var result = null, slide = 0, slideTimer = 0, slideStart = 0, slideLeft = 0, lastMove = 0;

  var SLIDES = [
    // 1. The week, phone against God
    function (r) {
      // A sliver stays visible however small the share, so the bar reads as « almost nothing ».
      var godWidth = r.godMinutesWeek === 0 ? 0 : Math.max(3, r.godShare * 100);
      return '<h1 class="st">This is your week.</h1>' +
        '<div class="meter st"><div class="row"><span class="name">Your phone</span><span class="value"><span data-count="' + r.phoneHoursWeek + '">0</span><small>h</small></span></div>' +
        '<div class="track"><b data-width="100"></b></div></div>' +
        '<div class="meter st"><div class="row"><span class="name">God</span><span class="value" data-count="' + r.godMinutesWeek + '" data-minutes>0 min</span></div>' +
        '<div class="track"><b class="god" data-width="' + godWidth + '"></b></div></div>';
    },
    // 2. The year
    function (r) {
      return '<p class="huge st" data-count="' + r.phoneDaysYear + '">0</p>' +
        '<p class="huge-label st">full days a year<br>on your phone.</p>' +
        '<p class="sub st">' + (r.ratio ? r.ratio + ' times more than with God.' : 'And not even a minute with God.') + '</p>';
    },
    // 3. The verse
    function () {
      return '<figure class="verse-slide st"><blockquote>So teach us to number our days, that we may present a heart of wisdom.</blockquote>' +
        '<figcaption>Psalm 90:12</figcaption></figure>';
    },
    // 4. The answer, and the way to the App Store
    function (r) {
      return '<h1 class="st">Put a verse before ' + r.appName + '.</h1>' +
        '<p class="sub st">' + WHEN_LINES[r.when] + '</p>' +
        '<div class="phone st" aria-hidden="true"><div class="screen" id="demo"></div></div>';
    }
  ];
  var LAST = SLIDES.length - 1;


  /** Opened in a real browser from a bio link: the install button alone, and the App Store at once. */
  var AUTO_STORE_KEY = 'fl_quiz_auto_store';
  function renderStoreOnly() {
    result = null;
    progress.hidden = true;
    stories.hidden = true;
    hideCta();
    screen.className = 'store-only enter';
    var label = 'Get FaithLock on the App Store';
    screen.innerHTML = '<h1>Put a verse before your apps.</h1>' +
      (android
        ? '<p class="sub">FaithLock is on iPhone and iPad.</p><button type="button" class="btn cream small" id="copyLink">Copy the link for your iPhone</button>'
        : '<a class="btn go" id="store" href="' + storeLink('escape') + '">' + APPLE + label + '</a><p class="sub" id="storeNote">Opening the App Store…</p>') +
      '<div class="phone" aria-hidden="true"><div class="screen" id="demo"></div></div>';
    restart(screen);
    lockDemo('TikTok');
    if (android) { $('copyLink').addEventListener('click', function () { copyLink(this, 'escape'); }); return; }
    bindStore($('store'), 'escape');

    // The App Store opens by itself, once: coming back to this tab (or reloading it) leaves the button.
    var last = 0;
    try { last = Number(sessionStorage.getItem(AUTO_STORE_KEY) || 0); } catch (e) {}
    if (!ios || Date.now() - last < 30 * 60 * 1000) { $('storeNote').textContent = 'Tap the button to install.'; return; }
    try { sessionStorage.setItem(AUTO_STORE_KEY, String(Date.now())); } catch (e) {}
    whenAnalyticsReady(function () {
      var href = storeLink('escape_auto');
      trackLeaving('faithlock_store_click', storeClickProps('escape_auto', href, label));
      location.href = href;
    }, 1200);
  }

  function renderResult(arrived, toEnd) {
    result = compute();
    slide = toEnd ? LAST : 0;
    progress.hidden = true;
    stories.hidden = true;
    showSlide(1);
    window.scrollTo(0, 0);
    // Kept in the address, so a copied link reopens the result as it is.
    setQuery(function (q) { q.set('r', encode()); q.delete('v'); });
    if (!arrived) track('diagnostic_result', { phone_hours_week: result.phoneHoursWeek, god_minutes_week: result.godMinutesWeek, app: answers.app, when: answers.when });
  }

  function showSlide(dir) {
    clearTimeout(slideTimer);
    clearTimeout(demoTimer);
    lastMove = Date.now();
    var last = slide === LAST;
    screen.className = 'slides' + (dir < 0 ? ' back' : '') + (last ? ' last' : '');
    screen.innerHTML = SLIDES[slide](result);
    restart(screen);

    stories.classList.remove('paused');
    stories.innerHTML = SLIDES.map(function (s, i) {
      var state = i < slide || (i === slide && (last || reducedMotion)) ? 'done' : i === slide ? 'now' : '';
      return '<span class="' + state + '"><i></i></span>';
    }).join('');
    var filling = stories.querySelector('.now i');
    if (filling) filling.style.animationDuration = SLIDE_MS[slide] + 'ms';

    Array.prototype.forEach.call(screen.querySelectorAll('[data-count]'), function (el) {
      countUp(el, Number(el.dataset.count), el.hasAttribute('data-minutes') ? formatMinutes : String);
    });
    setTimeout(function () {
      Array.prototype.forEach.call(screen.querySelectorAll('[data-width]'), function (b) { b.style.width = b.dataset.width + '%'; });
    }, 50);
    if (last) lockDemo(result.appName.charAt(0).toUpperCase() + result.appName.slice(1));

    renderCta(last, null, 'quiz_result');
    track('diagnostic_slide', { index: slide + 1 });
    if (!last && !reducedMotion) schedule(SLIDE_MS[slide]);
  }

  function schedule(ms) {
    slideStart = Date.now();
    slideLeft = ms;
    slideTimer = setTimeout(function () { go(1, true); }, ms);
  }

  function go(dir, auto) {
    if (!result || (!auto && Date.now() - lastMove < 200)) return;
    var next = slide + dir;
    if (next < 0 || next > LAST) return;
    slide = next;
    showSlide(dir);
  }

  // Tap the right of the screen for the next one, the left edge to go back (as in stories).
  screen.addEventListener('click', function (e) {
    if (!result || e.target.closest('a, button')) return;
    go(e.clientX < window.innerWidth * 0.25 ? -1 : 1);
  });
  var touchX = null;
  screen.addEventListener('touchstart', function (e) { touchX = e.touches[0].clientX; }, { passive: true });
  screen.addEventListener('touchend', function (e) {
    if (!result || touchX === null) return;
    var dx = e.changedTouches[0].clientX - touchX;
    touchX = null;
    if (Math.abs(dx) > 50) { e.preventDefault(); go(dx < 0 ? 1 : -1); }
  });
  // A screen holds while the page is hidden.
  document.addEventListener('visibilitychange', function () {
    if (!result || slide === LAST || reducedMotion) return;
    if (document.hidden) {
      clearTimeout(slideTimer);
      slideLeft -= Date.now() - slideStart;
      stories.classList.add('paused');
    } else {
      stories.classList.remove('paused');
      schedule(Math.max(600, slideLeft));
    }
  });

  function hideCta() { cta.hidden = true; document.body.classList.remove('has-cta'); }

  /** The bottom bar: « Continue » between result screens, otherwise the App Store button. */
  function renderCta(last, label, ctaId) {
    cta.hidden = false;
    document.body.classList.add('has-cta');
    if (!last) {
      ctaInner.innerHTML = '<button type="button" class="btn" id="next">Continue</button>';
      $('next').addEventListener('click', function () { go(1); });
      return;
    }
    if (android) {
      ctaInner.innerHTML = '<p class="only">FaithLock is on iPhone and iPad.</p><button type="button" class="btn cream small" id="copyLink">Copy the link for your iPhone</button>';
      $('copyLink').addEventListener('click', function () { copyLink(this, 'result'); });
      return;
    }
    var onResult = ctaId === 'quiz_result';
    ctaInner.innerHTML =
      '<a class="btn' + (onResult ? ' go' : '') + '" id="store" href="' + storeLink(ctaId) + '">' + APPLE + (label || 'Take back my ' + result.phoneHoursWeek + ' hours') + '</a>' +
      (inApp && onResult ? '<button type="button" class="ask" id="ask">App Store not opening?</button>' : '');
    bindStore($('store'), ctaId);
    var ask = $('ask');
    if (ask) ask.addEventListener('click', function () { openCoach('asked'); });
  }

  function storeClickProps(ctaId, href, text) {
    return {
      // `location` stays « quiz_result » for every button of this page: /stats counts the quiz's
      // clicks by it. `cta_id` tells the buttons apart (quiz_question, quiz_result, escape, escape_auto).
      cta_id: ctaId, location: 'quiz_result', destination: 'official_app_store', destination_url: href,
      destination_type: inApp ? 'app_store' : 'onelink', page_path: location.pathname, button_text: text,
      step: ctaId === 'quiz_question' ? step + 1 : null, escaped_via: escapedVia,
      traffic_source: inApp || params.get('o') || params.get('utm_source') || (escapedVia ? 'tiktok' : 'direct')
    };
  }

  /** An App Store button: the click is recorded by beacon, then the link opens as it is (no delay). */
  function bindStore(el, ctaId) {
    el.addEventListener('click', function () {
      trackLeaving('faithlock_store_click', storeClickProps(ctaId, el.href, el.textContent));
      if (!inApp) return;
      // Inside a social app: still here shortly after the tap means the link was blocked.
      try { sessionStorage.setItem('fl_quiz_store_attempt', String(Date.now())); } catch (e) {}
      setTimeout(function () { if (document.visibilityState === 'visible') openCoach('store_blocked'); }, 700);
    });
  }

  function storeLink(ctaId) {
    if (inApp) {
      // Straight to apps.apple.com: inside a social app a redirect through another host is blocked.
      // ct names the campaign in App Store Connect; Apple only reports it once pt is set too.
      var direct = new URL('https://apps.apple.com/app/apple-store/' + APP_ID);
      if (APPLE_PROVIDER_TOKEN) direct.searchParams.set('pt', APPLE_PROVIDER_TOKEN);
      direct.searchParams.set('ct', inApp + '_' + (CAMPAIGNS[campaign] ? campaign : 'quiz'));
      direct.searchParams.set('mt', '8');
      return direct.toString();
    }
    // In a real browser the AppsFlyer OneLink works, and reports the install under its source.
    var link = new URL(ONELINK);
    link.searchParams.set('af_channel', params.get('o') || params.get('utm_source') || (escapedVia ? 'tiktok' : 'direct'));
    link.searchParams.set('af_sub1', location.pathname);
    link.searchParams.set('af_sub3', ctaId);
    return link.toString();
  }

  function countUp(el, target, format) {
    if (reducedMotion || target === 0) { el.textContent = format(target); return; }
    var start = performance.now();
    (function tick(now) {
      var k = Math.min(1, (now - start) / 500);
      el.textContent = format(Math.round(target * (1 - Math.pow(1 - k, 3))));
      if (k < 1 && document.body.contains(el)) requestAnimationFrame(tick);
    })(start);
  }

  /** What FaithLock does, shown: the app is locked, a verse is read, the app opens. */
  function lockDemo(label) {
    var demo = $('demo');
    var lock = function (open) {
      return '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2.5"/>' +
        (open ? '<path d="M8 11V7.5a4 4 0 0 1 7.6-1.7"/>' : '<path d="M8 11V7.5a4 4 0 0 1 8 0V11"/>') + '</svg>';
    };
    var moments = [
      ['<span class="tile">' + lock(false) + '</span><span class="app">' + label + '</span><span class="pill locked">Locked</span>', 1700],
      ['<span class="tiny caps">Read to unlock</span><p class="scripture">Turn my eyes away from worthless things; revive me with Your word.</p><span class="tiny">Psalm 119:37</span>', 2900],
      ['<span class="tile open">' + lock(true) + '</span><span class="app">' + label + '</span><span class="pill unlocked">Unlocked</span>', 1500]
    ];
    var i = reducedMotion ? 1 : 0;
    (function show() {
      if (!document.body.contains(demo)) return;
      demo.className = 'screen enter';
      demo.innerHTML = moments[i][0];
      restart(demo);
      if (reducedMotion) return;
      demoTimer = setTimeout(function () { i = (i + 1) % moments.length; show(); }, moments[i][1]);
    })();
  }

  // ─── The way out of a social app's browser ───────────────────
  function openCoach(reason) {
    if (!inApp || !coach.hidden) return;
    $('coachTitle').textContent = BROWSER_NAMES[inApp] + ' won’t open the App Store from here.';
    coach.hidden = false;
    $('coachClose').focus();
    track('diagnostic_escape_shown', { reason: reason });
  }
  function closeCoach() { coach.hidden = true; }
  coach.addEventListener('click', closeCoach);
  $('sheet').addEventListener('click', function (e) { e.stopPropagation(); });
  $('coachClose').addEventListener('click', closeCoach);
  $('coachCopy').addEventListener('click', function () { copyLink(this, 'escape'); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') return closeCoach();
    if (!result || !coach.hidden) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); go(1); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
  });

  function copyLink(button, from) {
    var done = function () { button.textContent = 'Link copied'; track('diagnostic_link_copied', { from: from }); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(location.href).then(done, function () { legacyCopy(done); });
    } else legacyCopy(done);
  }
  function legacyCopy(done) {
    var field = document.createElement('textarea');
    field.value = location.href; field.setAttribute('readonly', ''); field.style.position = 'fixed'; field.style.opacity = '0';
    document.body.appendChild(field); field.select();
    try { if (document.execCommand('copy')) done(); } catch (e) {}
    document.body.removeChild(field);
  }

  /** The store tap replaced this page with the app's « open in your browser » screen and the visitor came back. */
  function cameBack() {
    if (!inApp) return;
    try {
      var at = Number(sessionStorage.getItem('fl_quiz_store_attempt') || 0);
      if (at && Date.now() - at < 90000) { sessionStorage.removeItem('fl_quiz_store_attempt'); openCoach('returned'); }
    } catch (e) {}
  }
  window.addEventListener('pageshow', function (e) { if (e.persisted) cameBack(); });

  // ─── Start ───────────────────────────────────────────────────
  var arrived = decode(params.get('r'));
  track('diagnostic_view', { device: android ? 'android' : ios ? 'ios' : 'other', with_result: !!arrived, escaped_via: escapedVia });
  // Inside a social app, the address is marked at once: if « Open in browser » keeps it, the real
  // browser goes straight to the App Store (and if it does not, the bio path does the same).
  if (inApp) setQuery(function (q) { q.set('o', inApp); q.set('go', 'store'); q.delete('v'); });
  if (escapedVia) {
    // Reopened in a real browser after the way out: the escape worked. Sent by beacon once PostHog is
    // there (same visitor id), queued ahead of the App Store opening, which may leave the page.
    var reopened = function () { whenAnalyticsReady(function () { trackLeaving('diagnostic_browser_open', { origin: params.get('o') || 'tiktok', via: escapedVia }); }, 1200); };
    try { if (!sessionStorage.getItem('fl_quiz_reopened')) { sessionStorage.setItem('fl_quiz_reopened', '1'); reopened(); } }
    catch (e) { reopened(); }
    renderStoreOnly();
  } else if (arrived) {
    answers = arrived;
    step = QUESTIONS.length;
    renderResult(true, false);
    cameBack();
  } else {
    renderQuestion();
    cameBack();
  }
})();
</script>
</body>
</html>
